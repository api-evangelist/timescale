description: >-
  Tiger Cloud (formerly Timescale Cloud) is the managed offering for TimescaleDB.
  It uses consumption-based hourly billing for compute and average-GB-hour
  metering for storage. The community edition of TimescaleDB remains free under
  Apache 2.0; the Tiger / TimescaleDB Community License governs some features.
notes: >-
  Public pricing on tigerdata.com/pricing lists three managed tiers.
  Compute prices vary by region; storage prices are the same across regions.
  Free 30-day Performance trial with no credit card.
