quote: TimescaleDB is a PostgreSQL extension, not a separate database or fork, so you keep the same clients, drivers,
  and SQL you use with plain PostgreSQL. On top of that, it adds objects and commands for time-partitioned tables,
  rollups, compression, retention, and other time-series and analytics work.
