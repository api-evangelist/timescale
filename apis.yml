apis:
- name: Tiger Cloud API
  description: The Tiger Cloud REST API creates, resizes, forks, starts, stops and
    configures managed PostgreSQL services, read replica sets, VPCs and VPC peerings
    over HTTP. Authentication is a project-scoped personal access token (client key
    + secret) or an OAuth bearer token; the /auth/info operation reports which credential
    type the caller presented.
  humanURL: https://www.tigerdata.com/docs/reference/tiger-cloud-rest
  baseURL: https://console.cloud.tigerdata.com/public/api/v1
  tags:
  - Database
  - Cloud Infrastructure
  - Provisioning
  properties:
  - type: OpenAPI
    url: openapi/timescale-tiger-cloud-openapi-original.yml
  - type: Overlay
    url: overlays/timescale-tiger-cloud-overlay.yaml
  - type: Documentation
    url: https://www.tigerdata.com/docs/reference/tiger-cloud-rest
- name: Ghost API
  description: Ghost (ghost.build) is Tiger Data's agent-oriented Postgres service —
    "give every agent its own database". The v0 REST API manages spaces, members and
    invites, databases (create, fork, pause, resume, rename, share), API keys, usage
    and billing. Authentication is a bearer JWT or a gt_-prefixed API key token.
  humanURL: https://ghost.build/docs/#api-reference
  baseURL: https://api.ghost.build/v0
  tags:
  - Database
  - Agents
  - Provisioning
  properties:
  - type: OpenAPI
    url: openapi/timescale-ghost-openapi-original.yml
  - type: Overlay
    url: overlays/timescale-ghost-overlay.yaml
  - type: Documentation
    url: https://ghost.build/docs/
- name: Tiger Docs MCP Server
  description: A publicly reachable, anonymous Model Context Protocol server (server
    name pg-aiguide) serving hybrid semantic + BM25 search over Tiger Cloud, TimescaleDB,
    PostgreSQL and PostGIS documentation, plus a skills catalog for PostgreSQL and
    TimescaleDB work. tools/list responds without credentials.
  humanURL: https://www.tigerdata.com/docs/reference/tiger-cloud/tiger-mcp
  baseURL: https://mcp.tigerdata.com/docs
  tags:
  - MCP
  - Documentation
  - Agents
  properties:
  - type: MCPServer
    url: mcp/timescale-mcp.yml
  - type: ToolCrosswalk
    url: mcp/timescale-tool-crosswalk.yml
