note: >-
  Neither API uses RFC 9457 application/problem+json. Both return a flat vendor JSON
  envelope on application/json. Tiger Cloud collapses every failure into a single
  wildcard `4XX` response (ClientError) rather than enumerating 400/401/403/404/409;
  Ghost uses a `default` response (ErrorResponse) for the same purpose. This means
  neither spec tells a client which status codes an operation can actually return —
  the single largest error-semantics gap in this provider.
