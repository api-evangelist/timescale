description: >-
  FOCUS-aligned FinOps profile for Tiger Cloud (the managed TimescaleDB
  service). Compute is metered hourly per service-hour at a tier-specific rate
  that varies by region. Storage is metered as average GB-hour, priced
  uniformly across regions. Billed monthly in arrears in USD.
notes: >-
  Cost Explorer in the Tiger Console exposes per-service breakdown; storage
  tiering between high-perf and object/tiered storage is a primary
  optimisation lever for time-series workloads.
sources:
- https://www.tigerdata.com/pricing
- https://www.tigerdata.com/docs/use-timescale/billing
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Tiger Data
serviceCategory: Database (Time-Series)
billingModel:
  pricingCategory: Usage
  billingFrequency: Monthly (in arrears)
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Tiger Cloud
  ServiceCategory: Database
  ProviderName: Tiger Data
  PublisherName: Tiger Data
  InvoiceIssuerName: Tiger Data
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingUnit: service-hour
meters:
- name: compute_service_hours
  description: Hourly metering of running database services at tier-specific rates.
  unit: service-hour
  aggregation: sum
  dimensions:
  - service_id
  - tier
  - region
- name: storage_gb_hour_high_perf
  description: Average GB-hours of high-performance storage attached to services.
  unit: GB-hour
  aggregation: avg
  dimensions:
  - service_id
- name: storage_gb_hour_tiered
  description: Average GB-hours of tiered/object storage (cold).
  unit: GB-hour
  aggregation: avg
  dimensions:
  - service_id
- name: data_transfer
  description: Egress bandwidth out of Tiger Cloud services where applicable.
  unit: GB
  aggregation: sum
  dimensions:
  - service_id
  - region
- name: replicas
  description: Read-replica service-hours billed in addition to primary.
  unit: service-hour
  aggregation: sum
  dimensions:
  - service_id
  - replica_id
principles:
- name: Visibility
  description: Use Tiger Console Cost Explorer + invoice CSV for monthly spend; tag services with project/team metadata.
- name: Allocation
  description: One-service-per-team or labelled service names to map to FOCUS BillingAccountId / ResourceTag.
- name: Optimization
  description: Right-size tier; enable Hypercore (columnstore) compression on cold partitions; move historical chunks to tiered storage.
- name: Accountability
  description: Assign service owners; alert on monthly spend > budget via Tiger Console notifications.
