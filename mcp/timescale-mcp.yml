  url: https://mcp.tigerdata.com/docs
  method: POST jsonrpc tools/list
  http_status: 200
  content_type: text/event-stream
  authenticated: false
  note: >-
    tools/list and prompts/list both answer anonymously — no OAuth challenge, no
