servers:
- name: tiger-docs-mcp
  server_info:
    name: pg-aiguide
    version: 1.0.0
    protocolVersion: '2025-06-18'
  transport: http
  url: https://mcp.tigerdata.com/docs
  auth: none (anonymous)
  install: claude mcp add --transport http pg-aiguide https://mcp.tigerdata.com/docs
  source_repo: https://github.com/timescale/pg-aiguide
  capabilities:
    tools:
      listChanged: true
    prompts:
      listChanged: true
  tools:
  - name: search_docs
    title: Search Documentation
    description: >-
      Search documentation with hybrid semantic (vector) and keyword (BM25) search.
      Use semanticWeight to choose keyword-only (0), semantic-only (1), or a blend;
      mid values fuse rankings with RRF. Supports Tiger Cloud (TimescaleDB),
      PostgreSQL, and PostGIS.
    required_inputs: [source, query, limit, semanticWeight]
    annotations: {readOnlyHint: true, idempotentHint: true}
  - name: view_skill
    title: View Skill
    description: Retrieve detailed skills for TimescaleDB operations and best practices.
    annotations: {readOnlyHint: true}
  prompts:
  - design-postgis-tables
  - design-postgres-tables
  - find-hypertable-candidates
  - migrate-postgres-tables-to-hypertables
  - pgvector-semantic-search
  - postgres
  - postgres-hybrid-text-search
  - setup-timescaledb-hypertables
- name: tiger-mcp
  transport: stdio
  url: null
  auth: Tiger Cloud session (tiger auth login) — local process, not a hosted endpoint
  install: tiger mcp install
  source_repo: https://github.com/timescale/tiger-cli
  docs: https://www.tigerdata.com/docs/reference/tiger-cloud/tiger-mcp
  note: >-
    Ships inside the Tiger CLI binary. Proxies the hosted docs server above for
    search_docs/view_skill and adds typed service + database tools backed by the
    Tiger Cloud REST API. Six tools are withheld in --read-only mode
    (service_create, service_fork, service_start, service_stop, service_resize,
    service_update_password). Two metrics tools are gated behind an experimental flag.
  tools:
  - {name: service_list, source_operation: 'openapi/timescale-tiger-cloud-openapi-original.yml#getServices'}
  - {name: service_get, source_operation: 'openapi/timescale-tiger-cloud-openapi-original.yml#getService'}
  - {name: service_create, source_operation: 'openapi/timescale-tiger-cloud-openapi-original.yml#createService', read_only_gated: true}
  - {name: service_fork, source_operation: 'openapi/timescale-tiger-cloud-openapi-original.yml#forkService', read_only_gated: true}
  - {name: service_resize, source_operation: 'openapi/timescale-tiger-cloud-openapi-original.yml#resizeService', read_only_gated: true}
  - {name: service_start, source_operation: 'openapi/timescale-tiger-cloud-openapi-original.yml#startService', read_only_gated: true}
  - {name: service_stop, source_operation: 'openapi/timescale-tiger-cloud-openapi-original.yml#stopService', read_only_gated: true}
  - {name: service_update_password, source_operation: 'openapi/timescale-tiger-cloud-openapi-original.yml#updatePassword', read_only_gated: true}
  - {name: service_logs, source_operation: 'openapi/timescale-tiger-cloud-openapi-original.yml#getServiceLogs'}
  - {name: service_metrics_available, source_operation: 'openapi/timescale-tiger-cloud-openapi-original.yml#getServiceMetricsAvailableSeries', experimental: true}
  - {name: service_metrics_series, source_operation: 'openapi/timescale-tiger-cloud-openapi-original.yml#getServiceMetricsSeries', experimental: true}
  - {name: db_execute_query, source_operation: null, note: direct PostgreSQL wire protocol, not a REST operation}
  - {name: db_schema, source_operation: null, note: direct PostgreSQL wire protocol, not a REST operation}
  - {name: search_docs, note: proxied from https://mcp.tigerdata.com/docs}
  - {name: view_skill, note: proxied from https://mcp.tigerdata.com/docs}
