mcp_only:
- tool: search_docs
  servers: [tiger-docs-mcp, tiger-mcp, ghost-mcp]
  reason: >-
    Hybrid BM25 + vector documentation search. No public REST operation exists; the
    live inputSchema (source/query/limit/semanticWeight) was captured directly from
    tools/list and is stored in mcp/timescale-docs-mcp-tools.json.
- tool: view_skill
  servers: [tiger-docs-mcp, tiger-mcp, ghost-mcp]
  reason: Returns a TimescaleDB/PostgreSQL best-practice skill document. No REST equivalent.
- tool: db_execute_query
  servers: [tiger-mcp]
  reason: >-
    Runs a single SQL statement against a service over the PostgreSQL wire protocol,
    not over the Tiger Cloud REST API. There is no REST query endpoint.
- tool: db_schema
  servers: [tiger-mcp]
  reason: Returns a service database schema as readable text; PostgreSQL wire protocol, no REST equivalent.
- tool: ghost_sql
  servers: [ghost-mcp]
  reason: Executes SQL against a Ghost database over the PostgreSQL wire protocol; no REST equivalent.
- tool: ghost_schema
  servers: [ghost-mcp]
  reason: Reads a Ghost database schema over the PostgreSQL wire protocol; no REST equivalent.
- tool: ghost_connect
  servers: [ghost-mcp]
  reason: >-
    Returns a connection string. The Ghost spec exposes connection details as fields
    on the database object rather than as a dedicated operation, so this is a
    client-side composite.
