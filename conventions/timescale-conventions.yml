idempotency:
  supported: false
  header: null
  evidence: >-
    Neither spec declares an Idempotency-Key parameter and the string "idempot" does
    not appear anywhere in either OpenAPI document (0 matches across 87 operations).
    The docs publish no idempotency contract. Retrying a POST such as createService or
    createDatabase is therefore not safe by contract.
  partial_mitigation: >-
    Most mutating operations are action-shaped and effectively convergent
    (startService, stopService, pauseDatabase, resumeDatabase, enablePooler,
    setEnvironment), so a repeat call converges rather than duplicating. But the
    creating operations — createService, createVPC, createVPCPeering, createReplicaSet,
    createSpace, createDatabase, createApiKey, createInvite — have no dedupe key.
  note: >-
    NO `type: Idempotency` pointer is emitted in apis.yml for this provider. Emitting
    one would assert an idempotency contract that Tiger Data does not publish.
asynchrony:
  style: 202 Accepted + poll the resource
  tiger_cloud:
    accepted_operations: [createService, deleteService, startService, stopService,
      attachServiceToVPC, detachServiceFromVPC, resizeService, forkService, setHAReplica,
      createReplicaSet, deleteReplicaSet, resizeReplicaSet]
    response_body: the Service (or ReplicaSet) resource, immediately, with a DeployStatus
    poll_with: getService
    status_field: status (DeployStatus)
    status_enum: [QUEUED, DELETING, CONFIGURING, READY, DELETED, UNSTABLE, PAUSING,
      PAUSED, RESUMING, UPGRADING, OPTIMIZING]
  ghost:
    accepted_operations: [createDatabase, deleteDatabase, forkDatabase, pauseDatabase, resumeDatabase]
  no_operation_resource: neither API exposes a job/operation resource or a Location header
    to follow; the caller must poll the target resource itself
pagination:
